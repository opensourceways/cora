name: "gitcode/pulls-comments"
service: gitcode
args:
  - pulls
  - comments
  - --owner
  - openeuler
  - --repo
  - infrastructure
  - --number
  - 747
format: table
timeout_ms: 8000
assertions:
  - type: exit_code
    value: 0
  - type: stdout_not_empty
  - type: stderr_not_contains
    value: "ERROR"
