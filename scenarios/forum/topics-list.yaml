name: "forum/topics-list"
skip: true
skip_reason: "Forum instance may be unstable — enable when ready"
service: forum
args:
  - topics
  - list
format: table
timeout_ms: 10000
assertions:
  - type: exit_code
    value: 0
  - type: response_time_lt
    value: 8000
  - type: stdout_not_empty
  - type: stderr_not_contains
    value: "ERROR"
