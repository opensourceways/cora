name: "forum/users-list-user-action"
service: forum
args:
  - "users"
  - "list-user-action"
  - "--filter"
  - "1"
  - "--offset"
  - "0"
  - "--username"
  - "system"
format: table
timeout_ms: 10000
assertions:
  - type: exit_code
    value: 0
  - type: response_time_lt
    value: 8000
  - type: stdout_not_empty
  - type: stderr_not_contains
    value: "ERROR"
