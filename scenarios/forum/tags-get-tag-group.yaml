name: "forum/tags-get-tag-group"
skip: true
skip_reason: "Forum instance IP whitelist not configured for CI runner — enable when network access is granted"
service: forum
args:
  - "tags"
  - "get-tag-group"
  - "--id"
  - "1"
format: json
timeout_ms: 10000
assertions:
  - type: exit_code
    value: 0
  - type: json_has_keys
    values: ["tag_group"]
  - type: json_key_not_empty
    key: "tag_group"
