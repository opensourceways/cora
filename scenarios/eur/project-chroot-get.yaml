name: "eur/project-chroot-get"
service: eur
args:
  - project-chroot
  - get
  - --ownername
  - mywaaagh_admin
  - --projectname
  - pypi
  - --chrootname
  - openeuler-22.03_LTS_SP1-x86_64
format: json
timeout_ms: 10000
assertions:
  - type: exit_code
    value: 0
  - type: json_has_keys
    values: ["mock_chroot", "ownername", "projectname"]
  - type: json_key_not_empty
    key: "ownername"
